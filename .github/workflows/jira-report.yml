name: Jira Report

on:
  workflow_dispatch:
    inputs:
      project_key:
        description: Jira project key
        required: true
        default: KAN

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Excel report
        shell: pwsh
        env:
          JIRA_CLOUD_ID: ${{ vars.JIRA_CLOUD_ID }}
          JIRA_CLIENT_ID: ${{ secrets.JIRA_CLIENT_ID }}
          JIRA_CLIENT_SECRET: ${{ secrets.JIRA_CLIENT_SECRET }}
        run: |
          ./Export-JiraReport.ps1 -ProjectKey '${{ inputs.project_key }}' -OutputFolder "$env:RUNNER_TEMP/jira-report"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: jira-report
          path: ${{ runner.temp }}/jira-report/*.xlsx
          if-no-files-found: error
          retention-days: 7
