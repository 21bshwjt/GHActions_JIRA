name: Jira Report

on:
  workflow_dispatch:
    inputs:
      project_key:
        description: Jira project key
        required: true
        default: KAN

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Excel report
        shell: pwsh
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          ./Export-JiraReport.ps1 -ProjectKey '${{ inputs.project_key }}' -OutputFolder "$env:RUNNER_TEMP/jira-report"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: jira-report
          path: ${{ runner.temp }}/jira-report/*.xlsx
          if-no-files-found: error
